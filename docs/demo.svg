<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="t d">
<title id="t">QR Attendance demo</title>
<desc id="d">The lecturer's screen shows a QR code and a countdown bar. A student scans it with a phone, a green confirmation appears, the student's name is added to the live list and the QR changes.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.h{font-size:16px;font-weight:600;fill:#e6edf3}
.m{font-size:13px;fill:#8b949e}
.n{font-size:15px;fill:#e6edf3}
.qa{animation:qa 6s step-end infinite}
@keyframes qa{0%{opacity:1}25%{opacity:0}100%{opacity:0}}
.qb{opacity:0;animation:qb 6s step-end infinite}
@keyframes qb{0%{opacity:0}25%{opacity:1}75%{opacity:0}100%{opacity:0}}
.qc{opacity:0;animation:qc 6s step-end infinite}
@keyframes qc{0%{opacity:0}75%{opacity:1}100%{opacity:1}}
.bar{transform-box:fill-box;transform-origin:left center;animation:bar 3s linear infinite;animation-delay:-1.5s}
@keyframes bar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.i1{animation:i1 6s ease infinite}
@keyframes i1{0%,24%{opacity:0}25%,100%{opacity:1}}
.i2{animation:i2 6s ease infinite}
@keyframes i2{0%,74%{opacity:0}75%,100%{opacity:1}}
.toast{animation:ts 6s ease infinite}
@keyframes ts{0%,24%{opacity:0}25%,46%{opacity:1}47%,74%{opacity:0}75%,96%{opacity:1}97%,100%{opacity:0}}
.scan{animation:sc 1.5s ease-in-out infinite alternate}
@keyframes sc{from{transform:translateY(0)}to{transform:translateY(120px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.qb,.qc{opacity:0}}
</style>
