[package]
name = "qr-attendance"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = "0.14"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
